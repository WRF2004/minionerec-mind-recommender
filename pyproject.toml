[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minionerec-news-recsys"
version = "0.1.0"
description = "Exposure-aware MIND news recommendation with MiniOneRec generative retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
embedding = ["numpy>=1.24", "sentence-transformers>=3.0"]
rank = ["lightgbm>=4.0"]

[project.scripts]
newsrec-benchmark = "newsrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
